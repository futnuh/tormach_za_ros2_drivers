# MoveIt Servo Configuration for ZA6 Robot - SIMULATION MODE

## Properties of incoming commands
command_in_type: "unitless"    # "unitless" in the range [-1:1], as if from joystick
scale:
  linear: 0.05  # Max linear velocity. Meters per publish_period. Reduced for simulation
  rotational: 0.25  # Max angular velocity. Rads per publish_period. Reduced for simulation
  joint: 0.25  # Max joint angular velocity. Reduced for simulation

# Default to driving the arm at safer speed
override_velocity_scaling_factor: 0.5

## Properties of outgoing commands
publish_period: 0.01  # 1/Nominal publish rate [seconds]
low_latency_mode: false

# What type of topic does your robot driver expect?
command_out_type: trajectory_msgs/JointTrajectory

# What to publish?
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

## Plugins for smoothing outgoing commands
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

## MoveIt properties
move_group_name: manipulator
planning_frame: world
is_primary_planning_scene_monitor: false

## Other frames
ee_frame_name: grasp_link
robot_link_command_frame: tool0

## Stopping behaviour
incoming_command_timeout: 0.5  # seconds

## Configure handling of singularities and joint limits
lower_singularity_threshold: 25.0
hard_stop_singularity_threshold: 40.0
joint_limit_margin: 0.1

## Topic names
cartesian_command_in_topic: /servo_cmd/pose
joint_command_in_topic: /servo_cmd/joint
joint_topic: /joint_states
status_topic: /servo/status
command_out_topic: /joint_trajectory_controller/joint_trajectory

## Collision checking for the entire robot body
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.006
scene_collision_proximity_threshold: 0.02

## Halt behavior (prevent halting all joints)
halt_all_joints_in_cartesian_mode: false
halt_all_joints_in_joint_mode: false
