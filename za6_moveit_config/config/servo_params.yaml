/**:
  ros__parameters:
    moveit_servo:
      move_group_name: manipulator
      planning_frame: world
      is_primary_planning_scene_monitor: true
      ee_frame_name: grasp_link
      robot_link_command_frame: tool0
      command_in_type: "unitless"
      publish_period: 0.01
      low_latency_mode: false
      command_out_type: "std_msgs/Float64MultiArray"
      publish_joint_positions: true
      publish_joint_velocities: false
      publish_joint_accelerations: false
      smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
      low_pass_filter_coeff: 1.5
      incoming_command_timeout: 0.5
      lower_singularity_threshold: 35.0  # Increased to allow motion near singularities
      hard_stop_singularity_threshold: 50.0  # Increased to allow motion near singularities
      joint_limit_margin: 0.1
      halt_all_joints_in_cartesian_mode: false
      halt_all_joints_in_joint_mode: false
      cartesian_command_in_topic: "/servo_node/delta_twist_cmds"
      joint_command_in_topic: "/servo_node/delta_joint_cmds"
      command_out_topic: "/streaming_controller/commands"
      joint_topic: "/joint_states"
      status_topic: "/servo_node/status"
      check_collisions: false
      collision_check_rate: 10.0
      self_collision_proximity_threshold: 0.1
      scene_collision_proximity_threshold: 0.1
      override_velocity_scaling_factor: 1.0
      scale:
        linear: 0.4  # Faster cartesian linear speed
        rotational: 2.0  # Faster cartesian angular speed
        joint: 1.0  # Keep joint speed responsive
    use_sim_time: false
